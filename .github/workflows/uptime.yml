name: Uptime

# Runs every 5 minutes. If a critical site or API is down, it opens a GitHub
# issue (or comments on the open one) so the outage is discovered here, not by
# the client. When everything recovers, the issue is closed automatically.

# The 5-minute schedule is deliberate. GitHub delays cron under load - the last
# few runs at 15 minutes actually landed 30 to 45 minutes apart - and
# myplopplop-api is on Render's free plan, which sleeps after 15 idle minutes.
# A tighter schedule keeps it awake as a side effect of watching it.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # pipefail matters: without it `tee` returns 0 and a real outage reports
      # as a green run. That happened on the very first run of this workflow.
      - name: Probe all endpoints
        id: probe
        shell: bash
        run: |
          set -o pipefail
          bash scripts/check.sh | tee results.txt

      - name: Open or update the outage issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY="$(printf 'Automated check failed at %s UTC.\n\n```\n%s\n```\n' \
            "$(date -u '+%Y-%m-%d %H:%M')" "$(cat results.txt)")"
          EXISTING="$(gh issue list --state open --label outage --limit 1 --json number -q '.[0].number')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "Outage detected" --label outage --body "$BODY"
          fi

      - name: Close the outage issue once everything is healthy
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING="$(gh issue list --state open --label outage --limit 1 --json number -q '.[0].number')"
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "All critical targets healthy again as of $(date -u '+%Y-%m-%d %H:%M') UTC."
          fi
